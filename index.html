<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080b10">
<!-- Standard name plus the apple- prefixed one, which older iOS still needs
     for the app to launch full screen from the home screen. -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Briefing">
<title>תדריך טיסה · SimBrief</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/brief.css">
</head>
<body>

<div id="app" class="app" hidden>
  <header class="header" id="header"></header>
  <div class="body">
    <nav class="rail" id="rail" aria-label="Briefing chapters"></nav>
    <main class="content" id="content" tabindex="-1"></main>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="setup">
    <h1 id="setup-heading">חיבור ל-SimBrief</h1>
    <p id="setup-explain">הזן את שם המשתמש או מספר הטייס שלך ב-SimBrief.</p>
    <form id="setup-form" autocomplete="off">
      <label for="username" id="setup-label">שם משתמש / Pilot ID</label>
      <input id="username" name="username" type="text" inputmode="latin" autocapitalize="none" spellcheck="false" required>
      <button class="btn" type="submit" id="setup-submit">טען תדריך</button>
    </form>
    <button class="btn ghost" type="button" id="setup-demo">הצג טיסת הדגמה</button>
    <div class="hint" id="setup-hint">שם המשתמש נשמר במכשיר בלבד.</div>
    <div class="error" id="setup-error" hidden></div>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
